services:
  db:
    image: postgres:15-alpine
    container_name: todo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-todo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todo_pass}
      POSTGRES_DB: ${DB_NAME:-todo_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-todo_user} -d ${DB_NAME:-todo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    image: ${DOCKER_IMAGE:-usuario/todo-app:latest}
    container_name: todo_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-todo_user}
      DB_PASSWORD: ${DB_PASSWORD:-todo_pass}
      DB_NAME: ${DB_NAME:-todo_db}
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-v1.0.0}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata: